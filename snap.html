<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snap Kit Share Test</title>

    <!-- Required OG tags -->
    <meta property="og:site_name" content="My Test Site" />
    <meta property="og:title" content="Testing Snap Kit Share!" />
    <meta property="og:image" content="https://kit.snapchat.com/ckweb/test/image.png" />

    <!-- Snapchat sticker (using Snap's own test image) -->
    <meta property="snapchat:sticker" content="https://kit.snapchat.com/ckweb/test/image.png" />

    <!-- Optional: add your App ID if you have one registered -->
    <!-- <meta property="snapchat:app_id" content="YOUR_APP_ID_HERE" /> -->

    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #f5f5f5;
      }
      h1 { color: #FFFC00; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
      .card {
        background: white;
        border-radius: 16px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      }
      p { color: #555; margin-bottom: 24px; }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>👻 Snap Kit Test</h1>
      <p>Click the button below to share to Snapchat</p>

      <!-- Default share button (shares this page's URL by default) -->
      <div
        class="snapchat-creative-kit-share"
        data-theme="dark"
        data-size="large"
        data-text="true"
      ></div>
    </div>

    <script>
      (function (d, s, id) {
        var js, sjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s);
        js.id = id;
        js.src = 'https://sdk.snapkit.com/js/v1/create.js';
        sjs.parentNode.insertBefore(js, sjs);
      })(document, 'script', 'snapkit-creative-kit-sdk');
    </script>
  </body>
</html>
